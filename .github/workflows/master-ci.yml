
name: Android Stable Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-main:
    name: Build Android Stable Release
    runs-on: ubuntu-latest

    concurrency:
      group: android-stable-release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew -PAPP_RELEASE_CHANNEL=stable :app:assembleStandardRelease

      - name: Rename APK
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APK_DIR="app/build/outputs/apk/standard/release"
          APK_SOURCE=$(find "$APK_DIR" -maxdepth 1 -name 'app-standard-release*.apk' | head -n 1)

          if [ -z "$APK_SOURCE" ]; then
            echo "::error::APK not found"
            exit 1
          fi

          mv "$APK_SOURCE" "$APK_DIR/video-downloader-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-android
          path: app/build/outputs/apk/standard/release/video-downloader-*.apk
          if-no-files-found: error
